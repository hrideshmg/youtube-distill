<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>youtube-distill</title>
  <!-- oat 0.8.0, vendored (pre-v1, so pinned deliberately) -->
  <link rel="stylesheet" href="/oat.min.css">
  <script src="/oat.min.js" defer></script>
  <!-- KaTeX 0.19.0, vendored (woff2 fonts only) -->
  <link rel="stylesheet" href="/katex/katex.min.css">
  <!-- Not deferred: a cached article can arrive before a deferred script runs. -->
  <script src="/katex/katex.min.js"></script>
  <style>
    main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem; }
    nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    form { display: flex; gap: 0.5rem; }
    form input { flex: 1; }
    #status { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.5rem; }
    #video { display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem; text-decoration: none; color: inherit; }
    #video img { width: 10rem; flex-shrink: 0; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 0.5rem; }
    #video .label { display: block; font-size: 0.85rem; opacity: 0.7; }
    #video strong { display: block; font-size: 1.1rem; line-height: 1.3; }
    #toc { margin-top: 1.5rem; font-size: 0.75rem; line-height: 1.35; }
    #toc ul { list-style: none; margin: 0; padding: 0; }
    #toc li { margin: 0; }
    #toc li.h3 { padding-left: 0.75rem; font-size: 0.7rem; opacity: 0.85; }
    #toc a { display: block; padding: 0.15rem 0 0.15rem 0.6rem; border-left: 2px solid transparent; text-decoration: none; }
    #toc a.active { border-left-color: currentColor; font-weight: 600; }
    /* Medium screens: pin the TOC to the right edge and push the column left to make room. */
    @media (min-width: 56rem) {
      #toc { position: fixed; top: 2rem; right: 1rem; width: 14rem;
             max-height: calc(100vh - 4rem); overflow-y: auto; margin-top: 0; }
      main { margin-right: 16rem; }
    }
    /* Wide screens: the centred column leaves enough room, so keep the TOC next to it. */
    @media (min-width: 76rem) {
      #toc { right: auto; left: calc(50% + 23rem + 2rem); width: 16rem; }
      main { margin-right: auto; }
    }
    #article { margin-top: 1rem; line-height: 1.7; }
    #regenerate { margin-top: 2rem; }
    #article .arithmatex { overflow-x: auto; }
    #article img { max-width: 100%; border-radius: 0.5rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">New</a><a href="/history.html">History</a></nav>
    <h1>youtube-distill</h1>
    <p class="text-light">Turn an educational YouTube video into a readable article.</p>

    <form id="form">
      <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=…">
      <button id="submit" type="submit">Distill</button>
    </form>

    <div id="status" role="status" aria-busy="true" hidden><span id="step"></span></div>
    <div id="error" role="alert" data-variant="error" hidden></div>
    <a id="video" target="_blank" rel="noopener" hidden>
      <img alt="">
      <span><span class="label">Original video on YouTube ↗</span><strong></strong></span>
    </a>
    <aside id="toc" aria-label="Table of contents" hidden></aside>
    <article id="article" hidden></article>
    <button id="regenerate" class="outline" hidden>Regenerate</button>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    let lastUrl = null;

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      start($("url").value, false);
    });
    $("regenerate").addEventListener("click", () => start(lastUrl, true));

    async function start(url, regenerate) {
      lastUrl = url;
      $("submit").disabled = true;
      $("error").hidden = true;
      $("article").hidden = true;
      $("video").hidden = true;
      $("toc").hidden = true;
      $("regenerate").hidden = true;
      $("status").hidden = false;
      $("step").textContent = "Starting";

      try {
        const res = await fetch("/api/jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, regenerate }),
        });
        const body = await res.json();
        if (!res.ok) return finish(body.detail);
        history.replaceState(null, "", `/?v=${body.id}`);
        poll(body.id);
      } catch (err) {
        finish(String(err));
      }
    }

    async function poll(id) {
      const job = await (await fetch(`/api/jobs/${id}`)).json();
      $("step").textContent = job.step + "…";
      if (job.status === "running") return setTimeout(() => poll(id), 2000);
      if (job.status === "error") return finish(job.error);
      $("article").innerHTML = job.article_html;
      renderMath($("article"));
      // Regenerated screenshots reuse filenames, so bust the browser cache.
      for (const img of $("article").querySelectorAll("img")) img.src += `?v=${Date.now()}`;
      $("article").hidden = false;
      $("video").href = `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;
      $("video").querySelector("strong").textContent = job.title || "Watch on YouTube";
      const thumb = $("video").querySelector("img");
      thumb.hidden = !job.thumbnail;
      if (job.thumbnail) thumb.src = job.thumbnail;
      $("video").hidden = false;
      buildToc();
      $("regenerate").hidden = false;
      finish();
    }

    // Opened from history (or a shared link): show that video's article.
    const v = new URLSearchParams(location.search).get("v");
    if (v) {
      lastUrl = `https://www.youtube.com/watch?v=${v}`;
      $("url").value = lastUrl;
      $("submit").disabled = true;
      $("status").hidden = false;
      poll(v);
    }

    // The server wraps each equation (still raw LaTeX) in .arithmatex: a <div>
    // for display maths, a <span> for inline. Strip the \[ \] / \( \) and typeset.
    function renderMath(root) {
      for (const el of root.querySelectorAll(".arithmatex")) {
        const tex = el.textContent.trim().replace(/^\\[[(]/, "").replace(/\\[\])]$/, "");
        katex.render(tex, el, { displayMode: el.tagName === "DIV", throwOnError: false });
      }
    }

    let tocHeadings = [];
    let tocLinks = [];

    // Built client-side from the rendered h2/h3 headings (the h1 is the article title).
    function buildToc() {
      tocHeadings = [...$("article").querySelectorAll("h2, h3")];
      $("toc").hidden = tocHeadings.length === 0;
      if (!tocHeadings.length) return;

      const list = document.createElement("ul");
      tocLinks = tocHeadings.map((h, i) => {
        h.id = `section-${i}`;
        const a = Object.assign(document.createElement("a"), { href: `#${h.id}`, textContent: h.textContent });
        const li = document.createElement("li");
        li.className = h.tagName.toLowerCase();
        li.append(a);
        list.append(li);
        return a;
      });
      $("toc").replaceChildren(list);
      updateToc();
    }

    // Active section = last heading that has scrolled up past the top of the viewport.
    function updateToc() {
      if (!tocHeadings.length) return;
      let current = 0;
      tocHeadings.forEach((h, i) => { if (h.getBoundingClientRect().top <= 100) current = i; });
      tocLinks.forEach((a, i) => a.classList.toggle("active", i === current));
      tocLinks[current].scrollIntoView({ block: "nearest" });
    }

    let tocTicking = false;
    addEventListener("scroll", () => {
      if (tocTicking) return;
      tocTicking = true;
      requestAnimationFrame(() => { tocTicking = false; updateToc(); });
    }, { passive: true });

    function finish(error) {
      $("status").hidden = true;
      $("submit").disabled = false;
      if (error) {
        $("error").textContent = error;
        $("error").hidden = false;
      }
    }
  </script>
</body>
</html>
